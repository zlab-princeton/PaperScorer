[project]
name = "paperscorer"
version = "0.1.0"
description = "PaperScorer ecosystem orchestrator: setup, model selection, GPU/slurm config, and end-to-end paper review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "huggingface_hub>=0.24",
]

[project.scripts]
paperscorer = "paperscorer_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperscorer_orchestrator"]
